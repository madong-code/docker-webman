name: build-image

# 版本控制：镜像 tag = PHP 版本号（如 8.2-cli-alpine）
#   git tag 8.2-cli-alpine        → ghcr.io/madong-code/docker-webman:8.2-cli-alpine
#   git tag 8.3.4-cli-alpine      → 同上，PHP 版本取 "-" 之前的部分
on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag，同时作为 PHP 版本标识（如 8.3-cli-alpine）'
        required: true
      push:
        description: '是否推送到 GHCR'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # 可选：配好下面 3 个 Secrets，镜像会「同时」推送到国内仓库
      # （国内服务器拉 ghcr.io 通常不通，推 ACR/TCR 后拉取更快）
      #   ACR_IMAGE_PREFIX = registry.cn-hangzhou.aliyuncs.com/<命名空间>/docker-webman
      #   ACR_USERNAME / ACR_PASSWORD = 镜像仓库的用户名与密码
      ACR_IMAGE_PREFIX: ${{ secrets.ACR_IMAGE_PREFIX }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 规范化镜像仓库名
        run: |
          # GHCR 不接受大写字母：仓库属主或名称含大写时，docker push 会直接
          # 报 invalid reference format，这里统一转小写并作为唯一来源写入 env
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${REPO}" >> "$GITHUB_ENV"
          echo "IMAGE_REPO = ghcr.io/${REPO}"

      - name: 解析 tag → PHP 版本
        id: meta
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PHP_VERSION="${TAG%%-*}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "php_version=${PHP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "镜像 tag      : ${TAG}"
          echo "PHP_VERSION   : ${PHP_VERSION}"

      - name: 构建镜像
        run: |
          docker build \
            --build-arg "PHP_VERSION=${{ steps.meta.outputs.php_version }}" \
            -t "${IMAGE_REPO}:${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_REPO}:latest" \
            .

      - name: 构建结果自检（PHP / 扩展 / Node / pnpm / s6 服务定义）
        continue-on-error: true          # 仅输出信息，失败不阻塞后续推送
        run: |
          # 必须用 --entrypoint 覆盖镜像入口，否则会启动 s6 + webman（CI 里没有应用目录）
          # s6 服务定义必须完整打印：缺 type 会让容器启动即 s6-rc-compile fatal，
          # 而 s6 只报「unable to read .../type」，不看这里很难定位（曾踩过）
          docker run --rm --entrypoint sh "${IMAGE_REPO}:${{ steps.meta.outputs.tag }}" \
            -c "php -v | head -1; node -v; pnpm -v; php -m | tr '\n' ' '; echo; \
                echo '--- s6 服务定义 ---'; \
                ls -l /etc/s6-overlay/s6-rc.d/webman/; \
                printf 'type = '; cat /etc/s6-overlay/s6-rc.d/webman/type; \
                echo '--- user bundle ---'; \
                ls -l /etc/s6-overlay/s6-rc.d/user/contents.d/"

      - name: 推送前诊断
        if: github.event_name == 'push' || inputs.push
        run: |
          echo "镜像仓库 : ${IMAGE_REPO}"
          echo "待推送镜像："
          docker images "${IMAGE_REPO}" --format '  {{.Repository}}:{{.Tag}}  ({{.Size}})'

      - name: 推送到 GHCR
        if: github.event_name == 'push' || inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # GHCR 偶发 `unknown blob`（层上传中断）多为网络抖动，自动重试可越过；
          # 已成功的层在 registry 侧已存在，重试只会续传剩余部分
          push_retry() {
            for i in 1 2 3; do
              echo "==> docker push $1（第 ${i} 次）"
              if docker push "$1"; then
                echo "==> OK: $1"
                return 0
              fi
              echo "!! 第 ${i} 次推送失败，15s 后重试"
              sleep 15
            done
            echo "!! 连续 3 次推送失败：$1"
            return 1
          }
          push_retry "${IMAGE_REPO}:${{ steps.meta.outputs.tag }}"
          push_retry "${IMAGE_REPO}:latest"

      - name: 推送到国内镜像仓库（可选，配了 Secrets 才执行）
        if: (github.event_name == 'push' || inputs.push) && env.ACR_IMAGE_PREFIX != ''
        run: |
          REGISTRY="${ACR_IMAGE_PREFIX%%/*}"
          echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
          docker tag "${IMAGE_REPO}:${{ steps.meta.outputs.tag }}" "${ACR_IMAGE_PREFIX}:${{ steps.meta.outputs.tag }}"
          docker tag "${IMAGE_REPO}:latest" "${ACR_IMAGE_PREFIX}:latest"
          docker push "${ACR_IMAGE_PREFIX}:${{ steps.meta.outputs.tag }}"
          docker push "${ACR_IMAGE_PREFIX}:latest"
          echo "已推送：${ACR_IMAGE_PREFIX}:${{ steps.meta.outputs.tag }}"
